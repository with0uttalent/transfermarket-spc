<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TransferMarket</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header id="header">
  <div class="logo">Transfer<span>Market</span></div>
  <nav id="main-nav">
    <a href="#/" data-route="home">Home</a>
    <a href="#/teams" data-route="teams">Teams</a>
    <a href="#/players" data-route="players">Players</a>
    <a href="#/competitions" data-route="competitions">Competitions</a>
    <a href="#/transfers" data-route="transfers">Transfers</a>
    <a href="#/matches" data-route="matches">Matches</a>
    <a href="#/tournaments" data-route="tournaments">Tournaments</a>
    <a href="#/admin" data-route="admin" id="nav-admin" class="hidden">Admin</a>
  </nav>
  <div class="header-right">
    <input type="search" id="search-global" placeholder="Search players, teams…" autocomplete="off" />
    <span id="admin-indicator" class="hidden">ADMIN</span>
    <button id="btn-logout" class="hidden">Logout</button>
    <button id="btn-login">Login</button>
  </div>
</header>

<div id="page-wrapper">
  <div id="banner-left" class="banner-col"></div>
  <div id="app"></div>
  <div id="banner-right" class="banner-col"></div>
</div>

<div id="toast-container"></div>

<!-- Login Modal -->
<div id="login-modal" class="modal-overlay hidden">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <h3>Admin Login</h3>
      <button class="modal-close" id="login-modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div id="login-error" style="color:var(--red);font-size:13px;margin-bottom:12px;display:none"></div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" autocomplete="current-password" />
      </div>
      <div class="form-actions" style="justify-content:stretch">
        <button class="btn btn-green" id="btn-do-login" style="width:100%;justify-content:center">Sign In</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
