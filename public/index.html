<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TransferMarket</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header id="header">
  <div class="logo">Transfer<span>Market</span></div>
  <nav id="main-nav">
    <a href="#/" data-route="home">Главная</a>
    <a href="#/teams" data-route="teams">Команды</a>
    <a href="#/players" data-route="players">Игроки</a>
    <a href="#/competitions" data-route="competitions">Соревнования</a>
    <a href="#/transfers" data-route="transfers">Трансферы</a>
    <a href="#/matches" data-route="matches">Матчи</a>
    <a href="#/tournaments" data-route="tournaments">Турниры</a>
    <a href="#/leagues" data-route="leagues">Лиги</a>
    <a href="#/coach" data-route="coach" id="nav-coach" class="hidden">Мой клуб</a>
    <a href="#/admin" data-route="admin" id="nav-admin" class="hidden">Администратор</a>
  </nav>
  <div class="header-right">
    <input type="search" id="search-global" placeholder="Поиск игроков, команд…" autocomplete="off" />
    <div class="notif-wrap" id="notif-wrap">
      <button class="notif-btn" id="notif-btn" title="Уведомления">
        🔔
        <span class="notif-badge hidden" id="notif-badge">0</span>
      </button>
      <div class="notif-dropdown hidden" id="notif-dropdown">
        <div class="notif-header">Уведомления</div>
        <div id="notif-list"><div class="notif-empty">Нет уведомлений</div></div>
      </div>
    </div>
    <span id="user-indicator" class="hidden"></span>
    <button id="btn-logout" class="hidden">Выйти</button>
    <button id="btn-login">Войти</button>
  </div>
</header>

<div id="page-wrapper">
  <div id="banner-left" class="banner-col"></div>
  <div id="app"></div>
  <div id="banner-right" class="banner-col"></div>
</div>

<div id="toast-container"></div>

<!-- Login Modal -->
<div id="login-modal" class="modal-overlay hidden">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <h3>Вход</h3>
      <button class="modal-close" id="login-modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div id="login-error" style="color:var(--red);font-size:13px;margin-bottom:12px;display:none"></div>
      <div class="form-group">
        <label>Имя пользователя</label>
        <input type="text" id="login-username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-password" autocomplete="current-password" />
      </div>
      <div class="form-actions" style="justify-content:stretch">
        <button class="btn btn-green" id="btn-do-login" style="width:100%;justify-content:center">Войти</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
