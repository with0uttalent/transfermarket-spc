<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TransferMarket</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ─── Left Sidebar ────────────────────────────────────────── -->
<aside id="sidebar">
  <div class="sidebar-logo">Transfer<span>Market</span></div>

  <nav id="main-nav">
    <a href="#/" data-route="home" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-label">Главная</span>
    </a>
    <a href="#/teams" data-route="teams" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="nav-label">Команды</span>
    </a>
    <a href="#/players" data-route="players" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-label">Игроки</span>
    </a>
    <a href="#/competitions" data-route="competitions" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
      <span class="nav-label">Соревнования</span>
    </a>
    <a href="#/transfers" data-route="transfers" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      <span class="nav-label">Трансферы</span>
    </a>
    <a href="#/matches" data-route="matches" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8l-4 4 4 4M16 12H8"/></svg>
      <span class="nav-label">Матчи</span>
    </a>
    <a href="#/betting" data-route="betting" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span class="nav-label">Ставки</span>
    </a>
    <a href="#/tournaments" data-route="tournaments" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      <span class="nav-label">Турниры</span>
    </a>
    <a href="#/leagues" data-route="leagues" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="nav-label">Лиги</span>
    </a>
    <a href="#/free-agents" data-route="free-agents" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
      <span class="nav-label">Свободные агенты</span>
    </a>
    <a href="#/coach" data-route="coach" id="nav-coach" class="nav-item hidden">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span class="nav-label">Мой клуб</span>
    </a>
    <a href="#/admin" data-route="admin" id="nav-admin" class="nav-item hidden">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M14.83 9.17a4 4 0 0 1 0 5.66M6.34 6.34a10 10 0 0 0 0 14.14M9.17 9.17a4 4 0 0 0 0 5.66"/></svg>
      <span class="nav-label">Администратор</span>
    </a>
  </nav>

  <div class="sidebar-spacer"></div>

  <!-- Coach profile (shown when logged in as coach with profile) -->
  <div id="sidebar-coach-section" class="sidebar-coach hidden">
    <div id="sidebar-coach-avatar" class="sidebar-coach-av">C</div>
    <div class="sidebar-coach-body">
      <div id="sidebar-coach-name" class="sidebar-coach-name">COACH</div>
      <div class="sidebar-coach-role">Менеджер</div>
      <div id="sidebar-coach-team" class="sidebar-coach-team"></div>
      <div id="sidebar-coach-desc" class="sidebar-coach-desc"></div>
    </div>
    <a href="#/coach" class="btn-my-club">МОЙ КЛУБ</a>
  </div>

  <div class="sidebar-footer">
    <button id="btn-theme-toggle" class="theme-toggle-btn" title="Сменить тему">
      <span class="theme-toggle-icon" id="theme-toggle-icon">☀️</span>
      <span id="theme-toggle-label">Светлая тема</span>
    </button>
    <button id="btn-logout" class="sidebar-footer-link hidden">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Выйти</span>
    </button>
    <button id="btn-login" class="sidebar-footer-link sidebar-login">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      <span>Войти</span>
    </button>
  </div>
</aside>

<!-- ─── Main Area ─────────────────────────────────────────────── -->
<div id="layout-main">

  <!-- Top bar -->
  <header id="topbar">
    <h1 id="page-title" class="topbar-title">Главная</h1>
    <div class="topbar-right">
      <div class="topbar-search-wrap">
        <svg class="topbar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="search-global" placeholder="Поиск игроков, команд…" autocomplete="off" />
      </div>
      <div class="notif-wrap" id="notif-wrap">
        <button class="notif-btn" id="notif-btn" title="Уведомления">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-badge hidden" id="notif-badge">0</span>
        </button>
        <div class="notif-dropdown hidden" id="notif-dropdown">
          <div class="notif-header">Уведомления</div>
          <div id="notif-list"><div class="notif-empty">Нет уведомлений</div></div>
        </div>
      </div>
      <div id="topbar-user" class="topbar-user hidden">
        <div id="topbar-avatar" class="topbar-avatar">C</div>
        <div class="topbar-user-info">
          <div id="user-indicator" class="topbar-user-role"></div>
          <div class="topbar-user-sub">Профиль</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Content: app + right panel -->
  <div id="content-wrapper">
    <div id="app"></div>
    <aside id="right-panel">
      <div id="right-live" class="rp-section"></div>
      <div id="right-events" class="rp-section"></div>
      <div id="right-top-value" class="rp-section"></div>
      <div id="right-top-transfer" class="rp-section"></div>
      <div id="right-counts" class="rp-section"></div>
      <!-- Legacy banner containers (kept for JS compatibility) -->
      <div id="banner-left" style="display:none"></div>
      <div id="banner-right" style="display:none"></div>
    </aside>
  </div>
</div>

<div id="toast-container"></div>

<!-- Login Modal -->
<div id="login-modal" class="modal-overlay hidden">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <h3>Вход</h3>
      <button class="modal-close" id="login-modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div id="login-error" style="color:var(--red);font-size:13px;margin-bottom:12px;display:none"></div>
      <div class="form-group">
        <label>Имя пользователя</label>
        <input type="text" id="login-username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-password" autocomplete="current-password" />
      </div>
      <div class="form-actions" style="justify-content:stretch">
        <button class="btn btn-primary" id="btn-do-login" style="width:100%;justify-content:center">Войти</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Apply saved theme before paint to avoid flash
  (function() {
    const saved = localStorage.getItem('tm-theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<script src="/js/app.js"></script>
</body>
</html>
